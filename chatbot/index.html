<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>坏孩子 - 聊天机器人</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#0f1115;color:#222}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.header{display:flex;align-items:center;gap:14px;background:#1a1d24;border:1px solid #2a2f3a;border-radius:20px;padding:16px;color:#fff}
.header img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #ff7a1a}
.header h1{font-size:22px;margin:0}
.header p{margin:4px 0 0;color:#9aa3b2;font-size:14px}
.dot{display:inline-block;width:8px;height:8px;background:#22c55e;border-radius:50%;margin-right:6px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-top:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid #cbd5e1}
input[type=password]{flex:1;min-width:200px}
button{background:#ff7a1a;color:#fff;border:none;cursor:pointer}
button.ghost{background:#fff;color:#333;border:1px solid #cbd5e1}
#chat{height:420px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0}
.msg{max-width:85%;padding:10px 12px;border-radius:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:#ff7a1a;color:#fff}
.bot{align-self:flex-start;background:#eef2f7}
#input{flex:1}
.hint{font-size:13px;color:#888;margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
<img src="avatar.jpg" alt="坏孩子">
<div>
<h1>坏孩子</h1>
<p><span class="dot"></span>在线 · 接 DeepSeek · 说话直接，不绕弯</p>
</div>
</div>
<div class="card">
<div class="row">
<input id="key" type="password" placeholder="输入你的 DeepSeek API Key（sk-开头）">
<select id="model">
<option value="deepseek-flash">deepseek-flash（快、便宜）</option>
<option value="deepseek-v4-pro">deepseek-v4-pro（更强）</option>
</select>
<button id="saveKey">保存 Key</button>
<button id="clearKey" class="ghost">清除</button>
</div>
<div id="chat"></div>
<div class="row" style="margin-top:12px">
<input id="input" placeholder="跟坏孩子聊聊……" autocomplete="off">
<button id="send">发送</button>
</div>
<p class="hint">Key 只保存在你自己的浏览器里，不会上传到网站。没有 Key 先去 platform.deepseek.com 创建一个。说话风格还在等 song 的聊天记录来定制，目前先按“坏孩子”这个人设聊。</p>
</div>
</div>
<script>
const STYLE_PROMPT = "你是“坏孩子”，一个聊天机器人。说话要像 song 本人：简短、直接、口语化，用简体中文，带一点痞气和玩笑，不客套、不说教、不长篇大论。先给结论，再给理由。别人问问题就直接回，别反问太多。";
const history = [{role:"system", content: STYLE_PROMPT}];
const chatEl = document.getElementById("chat");
const keyEl = document.getElementById("key");
const modelEl = document.getElementById("model");
const inputEl = document.getElementById("input");
keyEl.value = localStorage.getItem("deepseek_api_key") || "";
function addMsg(text, cls){
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}
document.getElementById("saveKey").onclick = () => {
  const k = keyEl.value.trim();
  if(!k){ alert("先填 Key"); return; }
  localStorage.setItem("deepseek_api_key", k);
  alert("Key 已保存在这台浏览器里");
};
document.getElementById("clearKey").onclick = () => {
  localStorage.removeItem("deepseek_api_key");
  keyEl.value = "";
  alert("Key 已清除");
};
async function send(){
  const text = inputEl.value.trim();
  if(!text) return;
  const key = (localStorage.getItem("deepseek_api_key") || keyEl.value.trim());
  if(!key){ alert("先输入并保存 DeepSeek API Key"); return; }
  inputEl.value = "";
  addMsg(text, "user");
  history.push({role:"user", content:text});
  const botEl = addMsg("想一下……", "bot");
  try{
    const res = await fetch("https://api.deepseek.com/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer " + key},
      body: JSON.stringify({model: modelEl.value, messages: history, temperature: 0.9})
    });
    const data = await res.json();
    if(!res.ok){
      botEl.textContent = "调用失败（" + res.status + "）：" + (data.error && data.error.message ? data.error.message : "请检查 Key 和余额");
      history.pop();
      return;
    }
    const reply = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : "没拿到回复";
    botEl.textContent = reply;
    history.push({role:"assistant", content: reply});
  }catch(e){
    botEl.textContent = "网络请求失败，可能是浏览器跨域被挡了。换个浏览器试试，或者之后改走后端代理再调。错误：" + e.message;
    history.pop();
  }
}
document.getElementById("send").onclick = send;
inputEl.addEventListener("keydown", e => { if(e.key === "Enter") send(); });
addMsg("是我，坏孩子。想聊什么，直接说，别绕。", "bot");
</script>
</body>
</html>
