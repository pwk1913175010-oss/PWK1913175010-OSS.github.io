<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>坏孩子 - 聊天机器人</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#fff;color:#222}
.wrap{max-width:760px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px}
.header{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 0 12px;text-align:center}
.header img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid #ff7a1a;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.header h1{font-size:22px;margin:0}
#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:12px 0 20px}
.row-msg{display:flex;gap:10px;align-items:flex-start;max-width:85%}
.row-msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.msg{padding:11px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word;font-size:15px}
.bot .msg{background:#f0f0f0;color:#222;border-top-left-radius:4px}
.user .msg{background:#3b82f6;color:#fff;border-top-right-radius:4px}
.inputbar{display:flex;gap:10px;align-items:center;padding:12px 0 20px;position:sticky;bottom:0;background:#fff}
.inputbar input{flex:1;font-size:15px;padding:13px 16px;border-radius:24px;border:1px solid #ddd;outline:none}
.inputbar input:focus{border-color:#3b82f6}
#send{width:44px;height:44px;border-radius:50%;background:#111;color:#fff;border:none;cursor:pointer;font-size:18px;flex:none}
</style>
</head>

<input id="input" placeholder="消息" autocomplete="off">

</div>

const history = [];
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
function addMsg(text, cls){
  const row = document.createElement("div");
  row.className = "row-msg " + cls;
  if(cls === "bot"){
    const img = document.createElement("img");
    img.className = "avatar"; img.src = AVATAR; img.alt = "坏孩子";
    row.appendChild(img);
  }
  const d = document.createElement("div");
  d.className = "msg"; d.textContent = text;
  row.appendChild(d);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}
async function send(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = "";
  addMsg(text, "user");
  const botEl = addMsg("想一下……", "bot");
  try{
    const res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message: text, history: history.slice(-10)})
    });
    const data = await res.json();
    if(!res.ok){ botEl.textContent = "出问题了：" + (data.error || res.status); return; }
    botEl.remove();
    const lines = data.reply.split(/\n+/).map(s => s.trim()).filter(Boolean);
    for (const line of lines) { addMsg(line, "bot"); }
    history.push({role:"user", content:text}, {role:"assistant", content:data.reply});
  }catch(e){ botEl.textContent = "网络请求失败，稍后再试。错误：" + e.message; }
}
document.getElementById("send").onclick = send;
inputEl.addEventListener("keydown", e => { if(e.key === "Enter") send(); });
document.getElementById("topAvatar").src = AVATAR;
addMsg("是我，坏孩子。想聊什么，直接说，别绕。", "bot");
</script>
