<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iss 专属游戏库</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f2ff; color: #222; display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
  .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; }
  .avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #b39ddb; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  h1 { font-size: 30px; margin: 16px 0 6px; }
  .subtitle { color: #666; font-size: 15px; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; width: 100%; max-width: 720px; }
  .card { background: #fff; border-radius: 16px; padding: 20px; text-decoration: none; color: #222; box-shadow: 0 2px 10px rgba(0,0,0,.08); display: block; }
  .card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.14); }
  .card .icon { font-size: 40px; }
  .card h2 { font-size: 20px; margin: 10px 0 6px; }
  .card p { font-size: 14px; color: #666; margin: 0 0 12px; }
  .tag { display: inline-block; font-size: 13px; padding: 4px 10px; border-radius: 20px; }
  .play { background: #ede7f6; color: #5e35b1; }
  .soon { background: #f0f0f0; color: #888; }
  .card.soon { opacity: .75; }
  .footer { margin-top: 28px; font-size: 13px; color: #999; }
</style>
</head>
<body>
<div class="header">
  <img class="avatar" src="iss-avatar.webp" alt="iss">
  <h1>iss 专属游戏库</h1>
  <p class="subtitle">iss的专属小窝</p>
</div>
<div class="grid">
  <a class="card" href="minesweeper.html">
    <div class="icon">💣</div>
    <h2>扫雷</h2>
    <p>经典扫雷，初级 / 中级 / 高级三个难度，手机也能玩。</p>
    <span class="tag play">开始玩 →</span>
  </a>
  <a class="card" href="chess.html">
    <div class="icon">♟️</div>
    <h2>国际象棋</h2>
    <p>你执白棋，跟电脑下，简单 / 中等 / 困难三个难度。</p>
    <span class="tag play">开始玩 →</span>
  </a>
  <a class="card" href="snake.html">
    <div class="icon">🐍</div>
    <h2>贪吃蛇</h2>
    <p>吃苹果长大，越吃越快，别撞到自己和墙。</p>
    <span class="tag play">开始玩 →</span>
  </a>
</div>
<p class="footer">by iss</p>
</body>
</html>
