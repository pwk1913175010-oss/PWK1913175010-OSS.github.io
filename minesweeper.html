<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷 · 可爱版</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(160deg, #ffe3ef, #e6dcff); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 12px; }
  h1 { font-size: 30px; margin: 0 0 4px; color: #d63384; }
  .subtitle { color: #a06aa8; font-size: 14px; margin: 0 0 16px; }
  .panel { background: rgba(255,255,255,.85); border-radius: 24px; padding: 16px; box-shadow: 0 8px 24px rgba(214,51,132,.15); }
  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; justify-content: center; }
  .counter { background: #fff0f3; color: #ff5d8f; font-family: monospace; font-size: 24px; font-weight: bold; padding: 4px 10px; min-width: 56px; text-align: center; border-radius: 12px; }
  .face { font-size: 28px; width: 46px; height: 46px; border: none; border-radius: 50%; background: #ffe3ef; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .diffs button, .flagbtn { border: none; border-radius: 20px; background: #f3e8ff; color: #7b5ea7; padding: 7px 14px; cursor: pointer; font-size: 14px; }
  .diffs button.active, .flagbtn.on { background: #ff8fab; color: #fff; }
  .board { display: grid; gap: 2px; background: #fff; border-radius: 14px; padding: 6px; overflow: auto; max-width: 94vw; }
  .cell { width: 28px; height: 28px; border-radius: 7px; background: #ffc9dc; font-size: 17px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; box-sizing: border-box; }
  .cell:hover { background: #ffb9d1; }
  .cell.revealed { background: #fff7f0; cursor: default; }
  .cell.boom { background: #ffb3c6; }
  .n1 { color: #ff8fab; } .n2 { color: #6bcb77; } .n3 { color: #4d96ff; } .n4 { color: #b388ff; }
  .n5 { color: #ff7b54; } .n6 { color: #00b8a9; } .n7 { color: #ff5d8f; } .n8 { color: #9a8c98; }
  .status { margin-top: 14px; font-size: 15px; color: #7b5ea7; }
  .hint { margin-top: 6px; font-size: 13px; color: #b39ddb; }
</style>
</head>
<body>
<h1>🐾 扫雷</h1>
<p class="subtitle">可爱版 · by iss</p>
<div class="panel">
  <div class="topbar">
    <div class="counter" id="mineCounter">010</div>
    <button class="face" id="faceBtn" title="重新开始">🐱</button>
    <div class="counter" id="timer">000</div>
  </div>
  <div class="topbar diffs">
    <button data-diff="easy" class="active">初级 9×9</button>
    <button data-diff="medium">中级 16×16</button>
    <button data-diff="hard">高级 30×16</button>
    <button class="flagbtn" id="flagBtn">🎀 插旗：关</button>
  </div>
  <div class="board" id="board"></div>
</div>
<div class="status" id="status">点一个格子开始，左键挖开，右键插旗。</div>
<div class="hint">手机上没有右键，可以打开“插旗”开关再点格子插旗。</div>
<script>
const DIFFS = {
  easy:   { rows: 9,  cols: 9,  mines: 10 },
  medium: { rows: 16, cols: 16, mines: 40 },
  hard:   { rows: 16, cols: 30, mines: 99 }
};
let rows, cols, mineTotal, board, revealedCount, flagsUsed, gameOver, started, seconds, timerId, flagMode, diff = 'easy';
const boardEl = document.getElementById('board');
const mineEl = document.getElementById('mineCounter');
const timerEl = document.getElementById('timer');
const faceEl = document.getElementById('faceBtn');
const statusEl = document.getElementById('status');
const flagBtn = document.getElementById('flagBtn');

function pad(n) { return String(n).padStart(3, '0'); }
function neighbors(r, c) {
  const out = [];
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (dr === 0 && dc === 0) continue;
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push([nr, nc]);
  }
  return out;
}
function newGame() {
  const d = DIFFS[diff];
  rows = d.rows; cols = d.cols; mineTotal = d.mines;
  board = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) row.push({ mine: false, count: 0, revealed: false, flagged: false });
    board.push(row);
  }
  revealedCount = 0; flagsUsed = 0; gameOver = false; started = false; seconds = 0;
  clearInterval(timerId);
  mineEl.textContent = pad(mineTotal);
  timerEl.textContent = '000';
  faceEl.textContent = '🐱';
  statusEl.textContent = '点一个格子开始，左键挖开，右键插旗。';
  boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', 28px)';
  boardEl.innerHTML = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.r = r; cell.dataset.c = c;
    cell.addEventListener('click', () => onCellClick(r, c));
    cell.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(r, c); });
    boardEl.appendChild(cell);
  }
}
function placeMines(safeR, safeC) {
  const safe = new Set([safeR + ',' + safeC]);
  neighbors(safeR, safeC).forEach(([nr, nc]) => safe.add(nr + ',' + nc));
  let placed = 0;
  while (placed < mineTotal) {
    const r = Math.floor(Math.random() * rows), c = Math.floor(Math.random() * cols);
    if (safe.has(r + ',' + c) || board[r][c].mine) continue;
    board[r][c].mine = true; placed++;
  }
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (board[r][c].mine) continue;
    board[r][c].count = neighbors(r, c).filter(([nr, nc]) => board[nr][nc].mine).length;
  }
}
function startTimer() {
  started = true;
  timerId = setInterval(() => { seconds++; timerEl.textContent = pad(Math.min(seconds, 999)); }, 1000);
}
function stopTimer() { clearInterval(timerId); }
function cellEl(r, c) { return boardEl.children[r * cols + c]; }
function renderCell(r, c) {
  const cell = board[r][c], el = cellEl(r, c);
  if (cell.flagged) { el.textContent = '🎀'; return; }
  if (!cell.revealed) { el.textContent = ''; return; }
  el.classList.add('revealed');
  if (cell.mine) { el.textContent = '💣'; el.classList.add('boom'); }
  else if (cell.count > 0) { el.textContent = cell.count; el.classList.add('n' + cell.count); }
  else el.textContent = '';
}
function reveal(r, c) {
  const cell = board[r][c];
  if (cell.revealed || cell.flagged) return;
  cell.revealed = true; revealedCount++;
  if (cell.mine) return lose(r, c);
  if (cell.count === 0) {
    const stack = [[r, c]];
    while (stack.length) {
      const [cr, cc] = stack.pop();
      neighbors(cr, cc).forEach(([nr, nc]) => {
        const n = board[nr][nc];
        if (!n.revealed && !n.flagged && !n.mine) {
          n.revealed = true; revealedCount++;
          renderCell(nr, nc);
          if (n.count === 0) stack.push([nr, nc]);
        }
      });
    }
  }
  renderCell(r, c);
  if (revealedCount === rows * cols - mineTotal) win();
}
function toggleFlag(r, c) {
  if (gameOver) return;
  const cell = board[r][c];
  if (cell.revealed) return;
  cell.flagged = !cell.flagged;
  flagsUsed += cell.flagged ? 1 : -1;
  mineEl.textContent = pad(Math.max(mineTotal - flagsUsed, 0));
  renderCell(r, c);
}
function onCellClick(r, c) {
  if (gameOver) return;
  if (flagMode) { toggleFlag(r, c); return; }
  if (!started) { placeMines(r, c); startTimer(); }
  const cell = board[r][c];
  if (cell.flagged) return;
  if (cell.revealed && cell.count > 0) {
    const flagCount = neighbors(r, c).filter(([nr, nc]) => board[nr][nc].flagged).length;
    if (flagCount === cell.count) {
      neighbors(r, c).forEach(([nr, nc]) => { if (!board[nr][nc].flagged) reveal(nr, nc); });
    }
    return;
  }
  reveal(r, c);
}
function revealAllMines() {
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const cell = board[r][c];
    if (cell.mine && !cell.flagged) { cell.revealed = true; renderCell(r, c); }
    if (!cell.mine && cell.flagged) { cellEl(r, c).textContent = '❌'; }
  }
}
function lose(r, c) {
  gameOver = true; stopTimer();
  faceEl.textContent = '😿';
  statusEl.textContent = '踩到雷了！点小猫再来一局。';
  revealAllMines();
  cellEl(r, c).classList.add('boom');
}
function win() {
  gameOver = true; stopTimer();
  faceEl.textContent = '😻';
  statusEl.textContent = '赢了！用时 ' + seconds + ' 秒，点小猫再来一局。';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const cell = board[r][c];
    if (cell.mine && !cell.flagged) { cell.flagged = true; renderCell(r, c); }
  }
  flagsUsed = mineTotal;
  mineEl.textContent = '000';
}
faceEl.addEventListener('click', newGame);
flagBtn.addEventListener('click', () => {
  flagMode = !flagMode;
  flagBtn.textContent = flagMode ? '🎀 插旗：开' : '🎀 插旗：关';
  flagBtn.classList.toggle('on', flagMode);
});
document.querySelectorAll('.diffs button[data-diff]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diffs button[data-diff]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    diff = btn.dataset.diff;
    newGame();
  });
});
newGame();
</script>
</body>
</html>
