<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · iss 游戏库</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(160deg, #ffe3ef, #e6dcff); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 12px; }
  h1 { font-size: 28px; margin: 0 0 4px; color: #5e35b1; }
  .subtitle { color: #7b5ea7; font-size: 14px; margin: 0 0 16px; }
  .back { color: #7b5ea7; text-decoration: none; font-size: 14px; margin-bottom: 12px; }
  .panel { background: rgba(255,255,255,.85); border-radius: 24px; padding: 16px; box-shadow: 0 8px 24px rgba(94,53,177,.15); display: flex; flex-direction: column; align-items: center; }
  canvas { border-radius: 14px; width: min(92vw, 420px); height: auto; background: #f3edff; }
  .scores { display: flex; gap: 20px; margin-top: 12px; font-size: 16px; color: #5e35b1; }
  .controls { display: flex; gap: 10px; margin-top: 12px; }
  .controls button { border: none; border-radius: 20px; background: #f3e8ff; color: #5e35b1; padding: 8px 20px; cursor: pointer; font-size: 15px; }
  .controls button.primary { background: #7b5ea7; color: #fff; }
  .status { margin-top: 12px; font-size: 15px; color: #7b5ea7; min-height: 22px; }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; margin-top: 16px; }
  .pad button { width: 56px; height: 56px; border: none; border-radius: 16px; background: #ede7f6; color: #5e35b1; font-size: 24px; cursor: pointer; }
  .pad button:active { background: #d1c4e9; }
  .pad .empty { background: transparent; }
  .hint { margin-top: 10px; font-size: 13px; color: #b39ddb; }
</style>
</head>
<body>
<a class="back" href="games.html">← 回游戏库</a>
<h1>🐍 贪吃蛇</h1>
<p class="subtitle">吃苹果长大，别撞到自己和墙 · by iss</p>
<div class="panel">
  <canvas id="game" width="400" height="400"></canvas>
  <div class="scores">
    <span>分数：<b id="score">0</b></span>
    <span>最高：<b id="best">0</b></span>
  </div>
  <div class="controls">
    <button class="primary" id="startBtn">开始</button>
    <button id="pauseBtn">暂停</button>
  </div>
  <div class="status" id="status">点开始，用方向键或下面的按钮控制。</div>
  <div class="pad">
    <span class="empty"></span>
    <button data-dir="up">↑</button>
    <span class="empty"></span>
    <button data-dir="left">←</button>
    <button data-dir="down">↓</button>
    <button data-dir="right">→</button>
  </div>
</div>
<div class="hint">键盘方向键或 WASD 也能控制，越吃越快。</div>
<script>
const COLS = 20, ROWS = 20, CELL = 20;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
let snake, dir, nextDir, food, score, best, timer, running, paused, speed;
best = parseInt(localStorage.getItem('iss-snake-best') || '0', 10);
bestEl.textContent = best;

const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
function setDir(name) {
  const d = DIRS[name];
  if (!d) return;
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
}
function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}
function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 }; nextDir = dir;
  score = 0; speed = 150; paused = false;
  placeFood();
  scoreEl.textContent = '0';
  pauseBtn.textContent = '暂停';
}
function drawCell(x, y, color, r) {
  ctx.fillStyle = color;
  const px = x * CELL, py = y * CELL;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(px + 1, py + 1, CELL - 2, CELL - 2, r); ctx.fill(); }
  else ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
}
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if ((x + y) % 2 === 0) { ctx.fillStyle = '#efe6ff'; ctx.fillRect(x * CELL, y * CELL, CELL, CELL); }
  }
  ctx.font = '16px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🍎', food.x * CELL + CELL / 2, food.y * CELL + CELL / 2 + 1);
  snake.forEach((s, i) => {
    if (i === 0) {
      drawCell(s.x, s.y, '#5e35b1', 6);
      ctx.fillStyle = '#fff';
      const ex = dir.x, ey = dir.y;
      const cx = s.x * CELL + CELL / 2, cy = s.y * CELL + CELL / 2;
      const px = -ey * 5, py = ex * 5;
      ctx.beginPath();
      ctx.arc(cx + ex * 3 + px, cy + ey * 3 + py, 2.6, 0, Math.PI * 2);
      ctx.arc(cx + ex * 3 - px, cy + ey * 3 - py, 2.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      drawCell(s.x, s.y, i % 2 ? '#6bcb77' : '#81d48a', 6);
    }
  });
}
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function startTimer() { stopTimer(); timer = setInterval(step, speed); }
function step() {
  if (paused) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    speed = Math.max(70, speed - 3);
    startTimer();
    placeFood();
  } else {
    snake.pop();
  }
  scoreEl.textContent = score;
  draw();
}
function gameOver() {
  stopTimer(); running = false;
  if (score > best) { best = score; localStorage.setItem('iss-snake-best', String(best)); bestEl.textContent = best; }
  statusEl.textContent = '游戏结束！得分 ' + score + '，点开始再来一局。';
  startBtn.textContent = '重新开始';
}
function startGame() {
  reset(); running = true;
  statusEl.textContent = '游戏中…';
  startBtn.textContent = '重新开始';
  startTimer(); draw();
}
startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', () => {
  if (!running) return;
  paused = !paused;
  pauseBtn.textContent = paused ? '继续' : '暂停';
  statusEl.textContent = paused ? '已暂停。' : '游戏中…';
});
document.querySelectorAll('.pad button[data-dir]').forEach(btn => {
  btn.addEventListener('click', () => setDir(btn.dataset.dir));
});
document.addEventListener('keydown', (e) => {
  const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  if (map[e.key]) { e.preventDefault(); setDir(map[e.key]); }
  if (e.key === ' ') { e.preventDefault(); if (!running) startGame(); }
});
reset(); draw();
</script>
</body>
</html>
