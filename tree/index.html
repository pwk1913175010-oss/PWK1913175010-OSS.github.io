<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>音频测试方案 · 产品大类与方案库</title>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f4f4f3; --ink:#141412; --muted:#5d5d58; --line:#e3e3e0; --line2:#c6c6c1;
  --accent:#0e7c69; --accent-deep:#075e4e; --accent-soft:#e9f3f0; --on-accent:#ffffff;
  --chip:#f1f1f0; --chip-ink:#2b2b27; --radius:4px;
  --serif:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
::selection{background:var(--accent);color:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit} button{min-height:40px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.top{max-width:1180px;margin:0 auto;padding:40px 20px 6px;border-top:4px solid var(--ink)}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.08em;font-weight:700;color:var(--ink)}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--accent);display:inline-block}
h1{font-family:var(--serif);font-size:clamp(32px,4.8vw,50px);line-height:1.18;letter-spacing:.01em;margin:16px 0 0;font-weight:900}
h1 .dot{color:var(--accent)}
.level-tag{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:13px;font-weight:700;color:var(--muted)}
.level-tag .n{font-family:var(--mono);background:var(--ink);color:var(--bg);border-radius:4px;padding:3px 9px;font-size:11.5px}
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ink);margin-top:20px}
.toolbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line2);border-radius:4px;padding:0 15px;min-height:46px;transition:border-color .15s ease,box-shadow .15s ease}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{flex:none;color:var(--muted)}
.search:focus-within svg{color:var(--accent)}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink);font-size:15px;min-height:44px}
.search input::placeholder{color:var(--muted)}
.filters{max-width:1180px;margin:0 auto;padding:10px 20px 14px;display:flex;gap:8px;flex-wrap:wrap}
.filters span{font-size:13px;color:var(--muted);align-self:center;margin-right:2px}
.fchip{border:1px solid var(--line2);background:var(--surface);border-radius:4px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px;color:var(--chip-ink);transition:border-color .15s ease,background .15s ease,color .15s ease}
.fchip:hover{border-color:var(--accent);color:var(--accent-deep)}
.fchip.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 48px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.cat-card{position:relative;text-align:left;background:var(--surface);border:0;border-radius:0;padding:20px 18px 16px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:11px;min-height:44px;overflow:hidden;transition:background .15s ease}
.cat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);opacity:0;transition:opacity .15s ease}
.cat-card:hover{background:var(--accent-soft)}
.cat-card:hover::before{opacity:1}
.cat-top{display:flex;align-items:flex-start;gap:12px}
.num{flex:none;font-family:var(--mono);font-size:15px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:4px;padding:4px 9px;margin-top:1px;letter-spacing:.04em;line-height:1.25}
.cat-card:hover .num{background:var(--accent);color:var(--on-accent)}
.cat-card h2{font-family:var(--serif);font-size:20px;margin:2px 0 0;line-height:1.35;font-weight:900}
.cat-group{font-size:13px;font-weight:700;padding:6px 11px;border:0;border-radius:4px;white-space:nowrap;margin-left:auto;flex:none;margin-top:2px;color:var(--on-accent);background:var(--accent)}
.cat-hw{font-size:13.5px;line-height:1.7;color:var(--muted);margin:0}
.cat-hw b{color:var(--ink);font-weight:700}
.cat-foot{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.cat-go{margin-left:auto;font-size:14px;font-weight:700;color:var(--accent-deep);white-space:nowrap}
.cat-card:hover .cat-go{color:var(--accent-deep);text-decoration:underline;text-underline-offset:3px}
.cat-card.hero{background:var(--surface)}
.cat-card.hero::before{opacity:1}
.empty{display:none;text-align:center;padding:38px 20px;background:var(--surface);border:1px dashed var(--line2);border-radius:4px;color:var(--muted);line-height:1.7;margin-top:14px}
.empty.show{display:block}
.detail-bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ink);margin:0 -20px;padding:10px 20px}
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:4px;padding:0 16px;font-weight:700;font-size:14px;cursor:pointer;min-height:42px;transition:border-color .15s ease,color .15s ease}
.back:hover{border-color:var(--accent);color:var(--accent-deep)}
.crumb-path{font-size:13px;color:var(--muted)}
.crumb-path b{color:var(--ink)}
.detail-head h2{font-family:var(--serif);font-size:clamp(26px,4vw,36px);margin:20px 0 8px;line-height:1.25;font-weight:900}
.detail-head .ref{font-size:13.5px;color:var(--muted);line-height:1.7;margin:0;max-width:840px}
.detail-head .ref b{color:var(--ink)}
.subgroup{margin-top:32px}
.subgroup-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:14px;flex-wrap:wrap}
.subgroup-head h3{font-family:var(--serif);font-size:19px;margin:0;font-weight:900}
.subgroup-head span{font-size:12.5px;color:var(--muted)}
.subgroup-head .sg-count{margin-left:auto;font-size:12.5px;font-weight:700;background:var(--ink);border:0;padding:5px 11px;border-radius:4px;color:var(--bg)}
.sol-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sol{border:1px solid var(--line);border-radius:4px;padding:16px;background:var(--surface);transition:border-color .15s ease}
.sol:hover{border-color:var(--accent)}
.sol-top{display:flex;gap:10px;align-items:flex-start}
.sol-num{flex:none;font-family:var(--mono);font-size:12.5px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:4px;padding:5px 9px;margin-top:2px}
.sol h4{font-family:var(--serif);font-size:16px;line-height:1.5;margin:0;font-weight:700}
.sol h4 .latest{font-family:inherit;font-size:12px;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:3px 9px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.sol-sec{margin-top:13px}
.sol-sec-t{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink);margin-bottom:7px}
.hw-list{display:flex;flex-wrap:wrap;gap:6px}
.hw-item{font-size:12.5px;line-height:1.45;background:var(--surface2);border:1px solid var(--line);color:var(--chip-ink);border-radius:4px;padding:5px 9px}
.hw-item.hl{border-color:var(--accent);color:var(--accent-deep);font-weight:700;background:var(--accent-soft)}
.hw-line{font-size:13px;line-height:1.65;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:8px 11px;margin-bottom:6px}
.hw-line:last-child{margin-bottom:0}
.hw-line b{color:var(--ink)}
.test-list{display:flex;flex-wrap:wrap;gap:6px}
.test{font-size:12.5px;line-height:1.45;background:var(--chip);color:var(--chip-ink);border-radius:4px;padding:5px 9px}
.test-txt{font-size:13px;line-height:1.65;color:var(--chip-ink)}
.sol-note{font-size:13px;line-height:1.65;color:var(--muted);background:var(--surface2);border:1px dashed var(--line2);border-radius:4px;padding:9px 11px;margin-top:11px}
.summary-note{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:4px;padding:17px 19px;font-size:13.5px;line-height:1.8;color:var(--muted)}
.summary-note b{color:var(--ink)}
.detail-card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:19px;margin-top:16px}
.note{font-size:13.5px;line-height:1.7;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.spec-sec{margin-top:16px}
.spec-sec:first-of-type{margin-top:14px}
.spec-t{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink);margin-bottom:8px}
.index{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px}
.index h2{font-family:var(--serif);font-size:18px;margin:0 0 6px;font-weight:900}
.index p{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.6}
.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.index-item{border:1px solid var(--line);border-radius:4px;padding:13px 14px;background:transparent;cursor:pointer;text-align:left;min-height:44px;color:var(--ink);transition:border-color .15s ease,background .15s ease}
.index-item:hover{border-color:var(--accent);background:var(--accent-soft)}
.index-item b{display:block;font-size:14px;margin-bottom:3px}
.index-item span{font-size:12.5px;color:var(--muted);line-height:1.5}
footer{max-width:1180px;margin:0 auto;padding:20px 20px 38px;color:var(--muted);font-size:13px;line-height:1.7;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--ink)}
footer strong{color:var(--ink)}
[hidden]{display:none!important}

.cat-count{flex:none;font-size:13px;font-weight:700;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:5px 10px;white-space:nowrap}
.cat-badge{font-size:12.5px;color:var(--muted);white-space:nowrap}
.res-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.res-head h2{margin:0}
.res-count{font-size:12.5px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:4px;padding:4px 10px}
.res-list{display:flex;flex-direction:column;gap:8px}
.res-item{border:1px solid var(--line);border-radius:4px;padding:11px 14px;background:transparent;cursor:pointer;text-align:left;color:var(--ink);min-height:44px;transition:border-color .15s ease,background .15s ease}
.res-item:hover{border-color:var(--accent);background:var(--accent-soft)}
.res-item b{display:block;font-size:14.5px;margin-bottom:2px}
.res-item span{font-size:12.5px;color:var(--muted);line-height:1.55;display:block}
.res-item .res-cat{color:var(--accent-deep);font-weight:700}
.dev-grid{display:flex;flex-wrap:wrap;gap:8px}
.dev-chip{border:1px solid var(--line2);background:var(--surface);border-radius:4px;padding:8px 13px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:40px;color:var(--ink);transition:border-color .15s ease,background .15s ease,color .15s ease}
.dev-chip:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--accent-soft)}
.dev-chip span{font-weight:600;color:var(--muted);font-size:12.5px}
.dev-chip:hover span{color:var(--accent-deep)}
.detail-search{flex:1 1 200px;max-width:430px;margin-left:auto;min-height:42px;padding:0 12px}
.detail-search input{min-height:40px;font-size:14px}
.detail-count{font-size:12.5px;font-weight:700;color:var(--accent-deep);white-space:nowrap}
@media (max-width:900px){ .cat-grid{grid-template-columns:1fr 1fr} }
@media (max-width:760px){ .sol-grid{grid-template-columns:1fr} .index-grid{grid-template-columns:1fr 1fr} .top{padding-top:26px} .toolbar-inner{padding:10px 14px 2px} .filters{padding-left:14px;padding-right:14px} .wrap,.top,footer{padding-left:14px;padding-right:14px} .detail-bar{margin:0 -14px;padding:10px 14px} }
@media (max-width:560px){ .cat-grid{grid-template-columns:1fr} .index-grid{grid-template-columns:1fr} .cat-top{flex-wrap:wrap} .cat-group{margin-left:38px;margin-top:0} }
@media print{ .toolbar,.detail-bar,.back{display:none} body{background:#fff} }
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>

</head>
<body>
<header class="top">
  <div class="eyebrow">Audiobus · 奥普新音频测试</div>
  <h1>音频测试方案<br>产品大类 · 方案库<span class="dot">.</span></h1>
</header>

<!-- ============ 一级界面 ============ -->
<div id="viewHome">
  <div class="toolbar" role="search">
    <div class="toolbar-inner">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="搜方案名 / 品类 / 设备 / 可测项目，如：异常音 / AD1000 / BT52…" aria-label="搜索方案、品类与设备">
      </label>
    </div>
    <div class="filters" id="filters">
      <span>大类分组：</span>
      <button class="fchip active" data-filter="">全部</button>
      <button class="fchip" data-filter="电声产品">电声产品</button>
      <button class="fchip" data-filter="麦克风与语音">麦克风与语音</button>
      <button class="fchip" data-filter="功放·蓝牙·车载电子">功放·蓝牙·车载电子</button>
      <button class="fchip" data-filter="噪声与异常音">噪声与异常音</button>
      <button class="fchip" data-filter="声学环境">声学环境</button>
      <button class="fchip" data-filter="音频设备">音频设备</button>
    </div>
  </div>

  <main class="wrap">
    <div class="cat-grid" id="catGrid"></div>
    <div class="empty" id="empty">没找到匹配的产品大类。<br>换个关键词试试，比如 扬声器、耳机、AD1000，或者点「全部」清除筛选。</div>

    <section class="index" id="solResults" hidden aria-label="方案搜索结果">
      <div class="res-head"><h2>匹配的方案</h2><span class="res-count" id="resCount"></span></div>
      <div class="res-list" id="resList"></div>
    </section>

    <section class="index" aria-label="按设备反查">
      <h2>按设备反查</h2>
      <p>手上有哪台设备，就点哪台——直接列出用到它的全部方案，点方案名进对应品类的方案库。</p>
      <div class="dev-grid" id="devGrid"></div>
    </section>

    <section class="index" aria-label="方案最多的品类">
      <h2>方案最多的品类</h2>
      <div class="index-grid">
        <button class="index-item" data-jump="noise"><b>噪音测试 · 26 个方案</b><span>NVH / 风扇 / 电动牙刷 / 对讲机 / 机器人 / 笔记本按压</span></button>
        <button class="index-item" data-jump="speaker"><b>扬声器 / 音箱 · 22 个方案</b><span>常规 / 车载喇叭 / 音箱 / 会议 / 上料机五类全收录</span></button>
        <button class="index-item" data-jump="earphone"><b>耳机 · 16 个方案</b><span>一拖八 / 单站自动化 v3 / 颈挂全流程 / PEAK4</span></button>
        <button class="index-item" data-jump="mic"><b>麦克风 · 13 个方案</b><span>MEMS / A2B / 驻极体 / 模组 V3</span></button>
        <button class="index-item" data-jump="amp"><b>功放 · 10 个方案</b><span>成品声学 / PCBA / 保伦老化 V5</span></button>
        <button class="index-item" data-jump="car"><b>汽车声学 · 9 个方案</b><span>三合一 / 功放老化 / 车机功能 / V2 最新</span></button>
      </div>
    </section>
  </main>
</div>

<!-- ============ 二级界面 ============ -->
<div id="viewDetail" hidden>
  <main class="wrap">
    <div class="detail-bar">
      <div class="crumb">
        <button class="back" id="backBtn" type="button">← 返回产品大类</button>
        <span class="crumb-path" id="crumbPath"></span>
        <label class="search detail-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="dq" type="search" placeholder="在本品类内搜方案 / 硬件 / 可测项目…" aria-label="在本品类内搜索方案">
        </label>
        <span class="detail-count" id="detailCount"></span>
      </div>
    </div>
    <div class="detail-head">
      <h2 id="detailTitle"></h2>
      <p class="ref" id="detailRef"></p>
    </div>
    <div id="detailBody"></div>
  </main>
</div>

<footer>
  <span>奥普新 audiobus · 让测试更快更精准</span>
</footer>

   {name:"MIC来料检验测试方案 v1",hw:"TMA-60 + AB14 + 定制治具(含人工嘴、PDM解码器) + 电流计",tests:"FR、灵敏度、消耗电流Idss"},
   {name:"成品MIC&Speak测试评估报告 v2",hw:"AD1000-4 + AMP50-A + BX5 D3 + MIC-20×3 + MS588 + AD325 + 静音房",tests:"mic频响/失真/灵敏度、Speak频响/失真/R&B/声道平衡、产品mic回环"}
  ]},
  {name:"A2B 麦克风",sub:"车载 A2B 麦克风",sols:[
   {name:"A2B麦克风测试方案书(1)",hw:"AD2122 + AMP50-A + MIC-20 + DA229 + HS8",tests:"FR、灵敏度(1KHz)、相位、THD"},
   {name:"A2B麦克风测试方案书(2)",hw:"AD1000-8 + AMP50-A×2 + DA229×3 + MIC-20×3 + 全频音响×3 + 电流计×3",tests:"FR、THD、相位、灵敏度、消耗电流IDD、电压Vin/Vout"},
   {name:"A2B麦克风研发测试方案书",hw:"AD2122 + AMP50-A + MIC-20 + DA229 + HS8",tests:"FR、灵敏度(1KHz)、相位、THD"}
  ]},
  {name:"话筒 / 无线 / 驻极体",sub:"手持与电容式传声器",sols:[
   {name:"无线麦克风测试方案书",hw:"TMA-60 + AB14 + NS65",tests:"FR、THD、灵敏度"},
   {name:"驻极体电容式传声器（保伦）一拖二方案",hw:"AD1000 + AMP-50A + 步进马达57×2 + 步进电机驱动器DM556×2 + 串口步进控制器YF-53×2 + MS-588×2",tests:"FR、THD、SNR、灵敏度（电机控制左右距离对比）"},
   {name:"麦克风测试方案书（TMA60&AB15）",hw:"TMA-60 + MIC-20 + AB15 + MS588",tests:"FR、THD、灵敏度"},
   {name:"话筒麦克风测试方案书",hw:"AD2122 + AMP-50D + MIC-20 + AB16 + Q350",tests:"FR、THD、灵敏度"}
  ]},
  {name:"自动化",sub:"流水线自动测试",sols:[
   {name:"MIC自动测试方案书",hw:"AD2122 + AMP50-A + MS588 + MIC-20 + 倍速链流线 + 不良品流水线",tests:"FR、THD、灵敏度"}
  ]}
 ]};
LIBS.room={ref:"半 / 全消声室方案 <b>16 份</b> + 消声室方案书 <b>7 份</b>，均为建筑与隔音工程方案，PDF 内只含规格参数，不含「核心硬件 + 可测项目」，按规格呈现。",
 roomNote:"均为半消声室 / 全消声室 / 静音房 / 听音室建筑与隔音工程方案，属客户定制建筑工程方案，联系人多为刘正武。",
 specGroups:[
  {t:"关键规格（不同方案数值不同，节选常见值）",items:["本底噪声 ≤25dBA / ≤30dBA / ≤35dBA 等","隔音量 ≥45dB 等","截止频率","自由场半径","房间尺寸（内 / 外尺寸）","隔音门隔音量"]},
  {t:"结构组成",items:["隔音墙体（多层阻尼复合隔音材料）","减震地面（悬浮减震、固有频率 ≤10Hz）","多层迫紧式隔音门","穿孔吸音板 + 吸音棉","过线孔","照明 / 插座"]}
 ]};
</script>

<script>
/* ================= 渲染与导航 ================= */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
/* 按括号深度拆分：只在顶层分隔符（+ 、 ，）处断开，括号内不拆 */
function splitTop(str){
  var out=[],depth=0,cur="",i,ch;
  for(i=0;i<str.length;i++){
    ch=str.charAt(i);
    if(ch==="("||ch==="（") depth++;
    else if(ch===")"||ch==="）"){ if(depth>0) depth--; }
    if(depth===0&&(ch==="+"||ch==="、"||ch==="，")){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur);
  return out.map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
}
function solHTML(s,n){
  var h='<article class="sol"><div class="sol-top"><span class="sol-num">S'+(n<10?'0':'')+n+'</span><h4>'+esc(s.name)+(s.latest?'<span class="latest">最新</span>':'')+'</h4></div>';
  if(s.empty){
    h+='<div class="sol-note">仅封面 / 标题页，PDF 内无设备清单与可测项目。</div>';
    if(s.note) h+='<div class="sol-note">'+esc(s.note)+'</div>';
    return h+'</article>';
  }
  h+='<div class="sol-sec"><div class="sol-sec-t">核心硬件</div>';
  if(s.lines){
    s.lines.forEach(function(L){
      var v=esc(L.v);
      if(L.hlPart){ v=v.replace(esc(L.hlPart),'<b>'+esc(L.hlPart)+'</b>'); }
      h+='<div class="hw-line"><b>'+esc(L.k)+'：</b>'+v+'</div>';
    });
  } else if(s.hwText){
    h+='<div class="hw-line">'+esc(s.hwText)+'</div>';
  } else if(s.hw && Array.isArray(s.hw)){
    h+='<div class="hw-list">';
    s.hw.forEach(function(it){
      if(typeof it==='string'){ h+='<span class="hw-item">'+esc(it)+'</span>'; }
      else { h+='<span class="hw-item hl">'+esc(it.t)+'</span>'; }
    });
    h+='</div>';
  } else if(s.hw){
    h+='<div class="hw-list">';
    splitTop(s.hw).forEach(function(it){ h+='<span class="hw-item">'+esc(it)+'</span>'; });
    h+='</div>';
  }
  h+='</div><div class="sol-sec"><div class="sol-sec-t">可测项目</div>';
  if(s.testLines){
    s.testLines.forEach(function(t){ h+='<div class="test-txt" style="margin-bottom:4px">'+esc(t)+'</div>'; });
  } else if(s.tests && Array.isArray(s.tests)){
    h+='<div class="test-list">';
    s.tests.forEach(function(t){ h+='<span class="test">'+esc(t)+'</span>'; });
    h+='</div>';
  } else if(s.tests){
    h+='<div class="test-list">';
    splitTop(s.tests).forEach(function(t){ h+='<span class="test'+(t.length>16?' wide':'')+'">'+esc(t)+'</span>'; });
    h+='</div>';
  }
  h+='</div>';
  if(s.note) h+='<div class="sol-note">'+esc(s.note)+'</div>';
  return h+'</article>';
}
function libHTML(lib){
  var n=0,h='';
  lib.groups.forEach(function(g){
    h+='<section class="subgroup"><div class="subgroup-head"><h3>'+esc(g.name)+'</h3><span>'+esc(g.sub)+'</span><span class="sg-count">'+g.sols.length+' 个方案</span></div><div class="sol-grid">';
    g.sols.forEach(function(s){ n++; h+=solHTML(s,n); });
    h+='</div></section>';
  });
  if(lib.summary) h+='<div class="summary-note">'+lib.summary+'</div>';
  return h;
}
function renderDetail(cat){
  var body=document.getElementById('detailBody');
  if(cat.id==='speaker'){
    body.innerHTML=libHTML(SPEAKER);
    document.getElementById('detailRef').innerHTML=SPEAKER.ref;
    return;
  }
  var lib=LIBS[cat.id];
  if(lib && lib.specGroups){
    var h='<div class="detail-card"><div class="note">'+esc(lib.roomNote)+'</div>';
    lib.specGroups.forEach(function(g){
      h+='<div class="spec-sec"><div class="spec-t">'+esc(g.t)+'</div><div class="test-list">';
      g.items.forEach(function(it){ h+='<span class="test">'+esc(it)+'</span>'; });
      h+='</div></div>';
    });
    h+='</div>';
    body.innerHTML=h;
    document.getElementById('detailRef').innerHTML=lib.ref;
    return;
  }
  body.innerHTML=libHTML(lib);
  document.getElementById('detailRef').innerHTML=lib.ref;
}
/* ================= 方案索引：计数 / 全文搜索 / 设备反查 ================= */
function solPlain(s){
  var parts=[s.name];
  if(s.hw){ if(Array.isArray(s.hw)){ s.hw.forEach(function(it){ parts.push(typeof it==='string'?it:it.t); }); } else parts.push(s.hw); }
  if(s.hwText) parts.push(s.hwText);
  if(s.lines) s.lines.forEach(function(L){ parts.push(L.k+' '+L.v); });
  if(s.tests){ if(Array.isArray(s.tests)){ parts.push(s.tests.join(' ')); } else parts.push(s.tests); }
  if(s.testLines) parts.push(s.testLines.join(' '));
  return parts.join(' ');
}
var SOL_INDEX=[]; var CAT_COUNT={};
function addLib(catId,lib){
  if(!lib||!lib.groups) return;
  var n=0;
  lib.groups.forEach(function(g){ g.sols.forEach(function(s){ n++; var plain=solPlain(s); SOL_INDEX.push({cat:catId,name:s.name,text:plain.toLowerCase(),plain:plain}); }); });
  CAT_COUNT[catId]=n;
}
addLib('speaker',SPEAKER);
Object.keys(LIBS).forEach(function(id){ addLib(id,LIBS[id]); });
function catById(id){ var f=null; CATS.forEach(function(c){ if(c.id===id) f=c; }); return f; }

var catGrid=document.getElementById('catGrid');
CATS.sort(function(a,b){return parseInt(a.num,10)-parseInt(b.num,10);});
CATS.forEach(function(c){
  var b=document.createElement('button'); b.type='button';
  b.className='cat-card '+c.g+(c.hero?' hero':''); b.setAttribute('data-cat-id',c.id);
  var extra=''; SOL_INDEX.forEach(function(e){ if(e.cat===c.id) extra+=' '+e.text; });
  b.setAttribute('data-group',GROUPS[c.g]); b.setAttribute('data-search',(c.name+' '+c.search).toLowerCase()+extra);
  var foot='<span class="cat-foot">';
  if(CAT_COUNT[c.id]) foot+='<span class="cat-count">'+CAT_COUNT[c.id]+' 个方案</span>';
  if(c.badge) foot+='<span class="cat-badge">'+esc(c.badge)+'</span>';
  foot+='<span class="cat-go">进入方案库 →</span></span>';
  b.innerHTML='<span class="cat-top"><span class="num">'+c.num+'</span><h2>'+esc(c.name)+'</h2><span class="cat-group">'+GROUPS[c.g]+'</span></span>'
    +'<p class="cat-hw">'+c.hw+'</p>'+foot;
  b.addEventListener('click',function(){ goDetail(c.id); });
  catGrid.appendChild(b);
});

/* ================= 路由：#/cat/<id> 可分享，浏览器后退可返回 ================= */
var viewHome=document.getElementById('viewHome'), viewDetail=document.getElementById('viewDetail');
var inNav=false, pendingTerm='';
function goDetail(id,term){
  inNav=true; pendingTerm=term||'';
  var target='#/cat/'+id;
  if(location.hash===target){ route(); } else location.hash=target;
}
function renderDetailView(cat){
  document.getElementById('detailTitle').textContent=cat.num+' · '+cat.name;
  document.getElementById('crumbPath').innerHTML='<b>'+esc(cat.name)+'</b> · '+GROUPS[cat.g];
  renderDetail(cat);
  viewHome.hidden=true; viewDetail.hidden=false;
  var dqEl=document.getElementById('dq');
  dqEl.value=pendingTerm; pendingTerm='';
  applyDetailFilter();
  window.scrollTo(0,0);
}
function renderHomeView(){ viewDetail.hidden=true; viewHome.hidden=false; }
function route(){
  var m=/^#\/cat\/([a-z0-9]+)$/.exec(location.hash||'');
  var cat=m?catById(m[1]):null;
  if(cat) renderDetailView(cat); else renderHomeView();
}
window.addEventListener('hashchange',route);
document.getElementById('backBtn').addEventListener('click',function(){
  if(inNav){ inNav=false; history.back(); }
  else { history.replaceState(null,'','#/'); route(); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !viewDetail.hidden) document.getElementById('backBtn').click(); });
document.querySelectorAll('[data-jump]').forEach(function(btn){ btn.addEventListener('click',function(){ goDetail(btn.getAttribute('data-jump')); }); });

/* ================= 详情页内搜索 ================= */
var dq=document.getElementById('dq');
function applyDetailFilter(){
  var term=(dq.value||'').trim().toLowerCase();
  var total=0, shown=0;
  var groups=document.querySelectorAll('#detailBody .subgroup');
  if(groups.length){
    Array.prototype.forEach.call(groups,function(sg){
      var vis=0;
      sg.querySelectorAll('.sol').forEach(function(sol){
        total++;
        var show=!term || sol.textContent.toLowerCase().indexOf(term)!==-1;
        sol.style.display=show?'':'none'; if(show){ vis++; shown++; }
      });
      sg.style.display=vis?'':'none';
      var cnt=sg.querySelector('.sg-count');
      if(cnt) cnt.textContent= term? ('命中 '+vis+' 个') : (vis+' 个方案');
    });
  } else {
    document.querySelectorAll('#detailBody .sol').forEach(function(sol){
      total++;
      var show=!term || sol.textContent.toLowerCase().indexOf(term)!==-1;
      sol.style.display=show?'':'none'; if(show) shown++;
    });
  }
  var dc=document.getElementById('detailCount');
  dc.textContent= total? (term? ('命中 '+shown+' / '+total+' 个方案') : ('共 '+total+' 个方案')) : '';
}
dq.addEventListener('input',applyDetailFilter);

/* ================= 一级搜索 + 分组筛选 + 方案级结果 ================= */
var q=document.getElementById('q'), empty=document.getElementById('empty');
var chips=Array.prototype.slice.call(document.querySelectorAll('.fchip')); var currentFilter='';
var solResults=document.getElementById('solResults'), resList=document.getElementById('resList'), resCount=document.getElementById('resCount');
function apply(){
  var term=(q.value||'').trim().toLowerCase(); var visible=0;
  Array.prototype.forEach.call(catGrid.children,function(card){
    var show=(!term || card.getAttribute('data-search').indexOf(term)!==-1) && (!currentFilter || card.getAttribute('data-group')===currentFilter);
    card.style.display=show?'':'none'; if(show) visible++;
  });
  resList.innerHTML='';
  if(term){
    var hits=SOL_INDEX.filter(function(e){
      if(e.text.indexOf(term)===-1) return false;
      if(currentFilter){ var c=catById(e.cat); if(!c || GROUPS[c.g]!==currentFilter) return false; }
      return true;
    });
    resCount.textContent='命中 '+hits.length+' 个方案';
    hits.slice(0,80).forEach(function(e){
      var c=catById(e.cat);
      var snippet=e.plain.indexOf(e.name)===0? e.plain.slice(e.name.length).replace(/^[\s·、，+：:]+/,'') : e.plain;
      if(snippet.length>110) snippet=snippet.slice(0,110)+'…';
      var b=document.createElement('button'); b.type='button'; b.className='res-item';
      b.innerHTML='<b>'+esc(e.name)+'</b><span><span class="res-cat">'+esc(c?c.name:e.cat)+'</span> · '+esc(snippet)+'</span>';
      b.addEventListener('click',function(){ goDetail(e.cat, term); });
      resList.appendChild(b);
    });
    solResults.hidden=hits.length===0;
    empty.classList.toggle('show',visible===0 && hits.length===0);
  } else {
    solResults.hidden=true;
    empty.classList.toggle('show',visible===0);
  }
}
q.addEventListener('input',apply);
chips.forEach(function(ch){ ch.addEventListener('click',function(){ chips.forEach(function(c){c.classList.remove('active')}); ch.classList.add('active'); currentFilter=ch.getAttribute('data-filter')||''; apply(); }); });

/* ================= 按设备反查 ================= */
var DEVICES=["MIC-20","MS588","AD711","BT52","BT168","AD1000-4","AD1000-8","AD2122","AD2504","AD2536","TMA-60","AMP50","RB01","AB14","AD8319","DDC1203"];
var devGrid=document.getElementById('devGrid');
DEVICES.forEach(function(d){
  var dl=d.toLowerCase(), n=0;
  SOL_INDEX.forEach(function(e){ if(e.text.indexOf(dl)!==-1) n++; });
  if(!n) return;
  var b=document.createElement('button'); b.type='button'; b.className='dev-chip';
  b.innerHTML=esc(d)+' <span>· '+n+' 个方案</span>';
  b.addEventListener('click',function(){
    chips.forEach(function(c2){ c2.classList.toggle('active',(c2.getAttribute('data-filter')||'')===''); });
    currentFilter=''; q.value=d; apply();
    solResults.scrollIntoView({behavior:'smooth',block:'start'});
  });
  devGrid.appendChild(b);
});

route();
</script>
</body>
</html>
