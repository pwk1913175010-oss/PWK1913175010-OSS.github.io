<style>
:root{
  --bg:#f4f5f3; --surface:#ffffff; --surface2:#f7f8f6; --ink:#161a17; --muted:#5f6a62; --line:#dee2dd; --line2:#c6cec6;
  --accent:#e85a0c; --accent-deep:#c44a06; --accent-soft:#fff1e8;
  --c1:#0f766e; --c1-bg:#e6f4f1; --c2:#1d6fb8; --c2-bg:#e8f1fa; --c3:#9a6a00; --c3-bg:#fdf3d7; --c4:#b45309; --c4-bg:#fef0e2; --c5:#475569; --c5-bg:#eef1f4; --c6:#9d2c4a; --c6-bg:#fbe9ee;
  --chip:#eff2ef; --chip-ink:#2c352f; --shadow:0 1px 2px rgba(20,30,20,.04),0 10px 28px rgba(20,30,20,.06); --shadow-lift:0 2px 4px rgba(20,30,20,.05),0 16px 36px rgba(20,30,20,.11); --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#101311; --surface:#191d1a; --surface2:#212622; --ink:#edf1ed; --muted:#9aa69e; --line:#2c332e; --line2:#3d4740; --accent:#ff7a2e; --accent-deep:#ff8f4d; --accent-soft:#3a2415; --c1:#2dd4bf; --c1-bg:#12332f; --c2:#6cb6ff; --c2-bg:#162f47; --c3:#eab308; --c3-bg:#3a320f; --c4:#fb923c; --c4-bg:#3d2712; --c5:#a8b6c3; --c5-bg:#232c33; --c6:#f27a9a; --c6-bg:#3a1a24; --chip:#262d28; --chip-ink:#dbe4dd; --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px rgba(0,0,0,.3); --shadow-lift:0 2px 4px rgba(0,0,0,.3),0 16px 36px rgba(0,0,0,.45); }
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
::selection{background:var(--accent);color:#fff}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input{font:inherit} button{min-height:40px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.top{max-width:1180px;margin:0 auto;padding:34px 20px 4px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--accent)}
.eyebrow::before{content:"";width:30px;height:2px;background:var(--accent);display:inline-block}
h1{font-size:clamp(30px,4.6vw,46px);line-height:1.12;letter-spacing:-.015em;margin:14px 0 0;font-weight:900}
h1 .dot{color:var(--accent)}
.level-tag{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.level-tag .n{font-family:"IBM Plex Mono",monospace;background:var(--ink);color:var(--bg);border-radius:7px;padding:3px 9px;font-size:11.5px;letter-spacing:.08em}
.toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-top:16px}
.toolbar-inner{max-width:1180px;margin:0 auto;padding:12px 20px 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 260px;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:0 15px;min-height:46px;transition:border-color .15s ease,box-shadow .15s ease}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink);font-size:15px;min-height:44px}
.search input::placeholder{color:var(--muted)}
.filters{max-width:1180px;margin:0 auto;padding:8px 20px 12px;display:flex;gap:8px;flex-wrap:wrap}
.filters span{font-size:13px;color:var(--muted);align-self:center;margin-right:2px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px;color:var(--chip-ink);transition:border-color .15s ease,background .15s ease,color .15s ease}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:16px 20px 44px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cat-card{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px 18px 16px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px;min-height:44px;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.cat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--gc,var(--accent));opacity:0;transition:opacity .18s ease}
.cat-card:hover{border-color:var(--line2);box-shadow:var(--shadow-lift);transform:translateY(-3px)}
.cat-card:hover::before{opacity:1}
.cat-card:active{transform:translateY(-1px)}
.g1{--gc:var(--c1)} .g2{--gc:var(--c2)} .g3{--gc:var(--c3)} .g4{--gc:var(--c4)} .g5{--gc:var(--c5)} .g6{--gc:var(--c6)}
.cat-top{display:flex;align-items:flex-start;gap:12px}
.num{flex:none;font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:700;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.g1 .num{background:var(--c1)} .g2 .num{background:var(--c2)} .g3 .num{background:var(--c3)} .g4 .num{background:var(--c4)} .g5 .num{background:var(--c5)} .g6 .num{background:var(--c6)}
.cat-card h2{font-size:18px;margin:5px 0 0;line-height:1.3;letter-spacing:-.01em}
.cat-group{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;margin-left:auto;flex:none;margin-top:4px}
.g1 .cat-group{background:var(--c1-bg);color:var(--c1)} .g2 .cat-group{background:var(--c2-bg);color:var(--c2)} .g3 .cat-group{background:var(--c3-bg);color:var(--c3)} .g4 .cat-group{background:var(--c4-bg);color:var(--c4)} .g5 .cat-group{background:var(--c5-bg);color:var(--c5)} .g6 .cat-group{background:var(--c6-bg);color:var(--c6)}
.cat-hw{font-size:13.5px;line-height:1.65;color:var(--muted);margin:0}
.cat-hw b{color:var(--ink);font-weight:700}
.cat-foot{margin-top:auto;padding-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.cat-go{margin-left:auto;font-size:13.5px;font-weight:800;color:var(--accent);white-space:nowrap;transition:transform .18s ease}
.cat-card:hover .cat-go{transform:translateX(3px)}
.cat-card.hero{border-color:color-mix(in srgb, var(--accent) 45%, var(--line));background:linear-gradient(180deg,var(--accent-soft),var(--surface) 64%)}
.empty{display:none;text-align:center;padding:38px 20px;background:var(--surface);border:1px dashed var(--line2);border-radius:var(--radius);color:var(--muted);line-height:1.7}
.empty.show{display:block}
.detail-bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 -20px;padding:10px 20px}
.crumb{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 16px;font-weight:700;font-size:14px;cursor:pointer;min-height:42px;transition:border-color .15s ease,color .15s ease}
.back:hover{border-color:var(--accent);color:var(--accent)}
.back:active{transform:scale(.98)}
.crumb-path{font-size:13px;color:var(--muted)}
.crumb-path b{color:var(--ink)}
.detail-head h2{font-size:clamp(24px,4vw,34px);margin:16px 0 6px;line-height:1.2;letter-spacing:-.01em}
.detail-head .ref{font-size:13.5px;color:var(--muted);line-height:1.65;margin:0;max-width:840px}
.detail-head .ref b{color:var(--ink)}
.subgroup{margin-top:28px}
.subgroup-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:9px;margin-bottom:13px;flex-wrap:wrap}
.subgroup-head h3{font-size:18px;margin:0;letter-spacing:-.01em}
.subgroup-head span{font-size:12.5px;color:var(--muted)}
.subgroup-head .sg-count{margin-left:auto;font-size:12px;font-weight:700;background:var(--chip);padding:4px 10px;border-radius:999px;color:var(--chip-ink)}
.sol-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sol{border:1px solid var(--line);border-radius:12px;padding:15px 16px;background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s ease}
.sol:hover{border-color:var(--line2)}
.sol-top{display:flex;gap:10px;align-items:flex-start}
.sol-num{flex:none;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:7px;padding:4px 8px;margin-top:2px}
.sol h4{font-size:15.5px;line-height:1.45;margin:0;font-weight:800}
.sol h4 .latest{font-size:11px;font-weight:800;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.sol-sec{margin-top:12px}
.sol-sec-t{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--accent-deep);margin-bottom:7px}
.hw-list{display:flex;flex-wrap:wrap;gap:6px}
.hw-item{font-size:12.5px;line-height:1.45;background:var(--surface2);border:1px solid var(--line);color:var(--chip-ink);border-radius:8px;padding:5px 9px}
.hw-item.hl{border-color:var(--accent);color:var(--accent-deep);font-weight:700;background:var(--accent-soft)}
.hw-line{font-size:13px;line-height:1.65;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-bottom:6px}
.hw-line:last-child{margin-bottom:0}
.hw-line b{color:var(--accent-deep)}
.test-list{display:flex;flex-wrap:wrap;gap:6px}
.test{font-size:12.5px;line-height:1.45;background:var(--chip);color:var(--chip-ink);border-radius:8px;padding:5px 9px}
.test.wide{border-radius:8px}
.test-txt{font-size:13px;line-height:1.65;color:var(--chip-ink)}
.sol-note{font-size:13px;line-height:1.65;color:var(--muted);background:var(--surface2);border:1px dashed var(--line2);border-radius:10px;padding:9px 11px;margin-top:11px}
.summary-note{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;font-size:13.5px;line-height:1.8;color:var(--muted)}
.summary-note b{color:var(--ink)}
.detail-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);margin-top:16px}
.note{font-size:13.5px;line-height:1.7;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.spec-sec{margin-top:16px}
.spec-sec:first-of-type{margin-top:14px}
.spec-t{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.index{margin-top:30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.index h2{font-size:16px;margin:0 0 6px;letter-spacing:-.01em}
.index p{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.6}
.index-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.index-item{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--surface2);cursor:pointer;text-align:left;min-height:44px;color:var(--ink);transition:border-color .15s ease,background .15s ease}
.index-item:hover{border-color:var(--accent);background:var(--surface)}
.index-item b{display:block;font-size:14px;margin-bottom:3px}
.index-item span{font-size:12.5px;color:var(--muted);line-height:1.5}
footer{max-width:1180px;margin:0 auto;padding:20px 20px 38px;color:var(--muted);font-size:13px;line-height:1.7;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line)}
footer strong{color:var(--ink)}
[hidden]{display:none!important}
@media (max-width:900px){ .cat-grid{grid-template-columns:1fr 1fr} }
@media (max-width:760px){ .sol-grid{grid-template-columns:1fr} .index-grid{grid-template-columns:1fr 1fr} .top{padding-top:22px} .toolbar-inner{padding:10px 14px 2px} .filters{padding-left:14px;padding-right:14px} .wrap,.top,footer{padding-left:14px;padding-right:14px} .detail-bar{margin:0 -14px;padding:10px 14px} }
@media (max-width:560px){ .cat-grid{grid-template-columns:1fr} .index-grid{grid-template-columns:1fr} .cat-top{flex-wrap:wrap} .cat-group{margin-left:46px;margin-top:0} }
@media print{ .toolbar,.detail-bar,.back{display:none} body{background:#fff} }
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important;transition:none!important} }
</style>
</head>

  {name:"A2B 麦克风",sub:"车载 A2B 麦克风",sols:[
   {name:"A2B麦克风测试方案书(1)",hw:"AD2122 + AMP50-A + MIC-20 + DA229 + HS8",tests:"FR、灵敏度(1KHz)、相位、THD"},
   {name:"A2B麦克风测试方案书(2)",hw:"AD1000-8 + AMP50-A×2 + DA229×3 + MIC-20×3 + 全频音响×3 + 电流计×3",tests:"FR、THD、相位、灵敏度、消耗电流IDD、电压Vin/Vout"},
   {name:"A2B麦克风研发测试方案书",hw:"AD2122 + AMP50-A + MIC-20 + DA229 + HS8",tests:"FR、灵敏度(1KHz)、相位、THD"}
  ]},
  {name:"话筒 / 无线 / 驻极体",sub:"手持与电容式传声器",sols:[
   {name:"无线麦克风测试方案书",hw:"TMA-60 + AB14 + NS65",tests:"FR、THD、灵敏度"},
   {name:"驻极体电容式传声器（保伦）一拖二方案",hw:"AD1000 + AMP-50A + 步进马达57×2 + 步进电机驱动器DM556×2 + 串口步进控制器YF-53×2 + MS-588×2",tests:"FR、THD、SNR、灵敏度（电机控制左右距离对比）"},
   {name:"麦克风测试方案书（TMA60&AB15）",hw:"TMA-60 + MIC-20 + AB15 + MS588",tests:"FR、THD、灵敏度"},
   {name:"话筒麦克风测试方案书",hw:"AD2122 + AMP-50D + MIC-20 + AB16 + Q350",tests:"FR、THD、灵敏度"}
  ]},
  {name:"自动化",sub:"流水线自动测试",sols:[
   {name:"MIC自动测试方案书",hw:"AD2122 + AMP50-A + MS588 + MIC-20 + 倍速链流线 + 不良品流水线",tests:"FR、THD、灵敏度"}
  ]}
 ]};
LIBS.room={ref:"半 / 全消声室方案 <b>16 份</b> + 消声室方案书 <b>7 份</b>，均为建筑与隔音工程方案，PDF 内只含规格参数，不含「核心硬件 + 可测项目」，按规格呈现。",
 roomNote:"均为半消声室 / 全消声室 / 静音房 / 听音室建筑与隔音工程方案，属客户定制建筑工程方案，联系人多为刘正武。",
 specGroups:[
  {t:"关键规格（不同方案数值不同，节选常见值）",items:["本底噪声 ≤25dBA / ≤30dBA / ≤35dBA 等","隔音量 ≥45dB 等","截止频率","自由场半径","房间尺寸（内 / 外尺寸）","隔音门隔音量"]},
  {t:"结构组成",items:["隔音墙体（多层阻尼复合隔音材料）","减震地面（悬浮减震、固有频率 ≤10Hz）","多层迫紧式隔音门","穿孔吸音板 + 吸音棉","过线孔","照明 / 插座"]}
 ]};
</script>

<script>
/* ================= 渲染与导航 ================= */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
/* 按括号深度拆分：只在顶层分隔符（+ 、 ，）处断开，括号内不拆 */
function splitTop(str){
  var out=[],depth=0,cur="",i,ch;
  for(i=0;i<str.length;i++){
    ch=str.charAt(i);
    if(ch==="("||ch==="（") depth++;
    else if(ch===")"||ch==="）"){ if(depth>0) depth--; }
    if(depth===0&&(ch==="+"||ch==="、"||ch==="，")){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur);
  return out.map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
}
function solHTML(s,n){
  var h='<article class="sol"><div class="sol-top"><span class="sol-num">S'+(n<10?'0':'')+n+'</span><h4>'+esc(s.name)+(s.latest?'<span class="latest">最新</span>':'')+'</h4></div>';
  if(s.empty){
    h+='<div class="sol-note">仅封面 / 标题页，PDF 内无设备清单与可测项目。</div>';
    if(s.note) h+='<div class="sol-note">'+esc(s.note)+'</div>';
    return h+'</article>';
  }
  h+='<div class="sol-sec"><div class="sol-sec-t">核心硬件</div>';
  if(s.lines){
    s.lines.forEach(function(L){
      var v=esc(L.v);
      if(L.hlPart){ v=v.replace(esc(L.hlPart),'<b>'+esc(L.hlPart)+'</b>'); }
      h+='<div class="hw-line"><b>'+esc(L.k)+'：</b>'+v+'</div>';
    });
  } else if(s.hwText){
    h+='<div class="hw-line">'+esc(s.hwText)+'</div>';
  } else if(s.hw && Array.isArray(s.hw)){
    h+='<div class="hw-list">';
    s.hw.forEach(function(it){
      if(typeof it==='string'){ h+='<span class="hw-item">'+esc(it)+'</span>'; }
      else { h+='<span class="hw-item hl">'+esc(it.t)+'</span>'; }
    });
    h+='</div>';
  } else if(s.hw){
    h+='<div class="hw-list">';
    splitTop(s.hw).forEach(function(it){ h+='<span class="hw-item">'+esc(it)+'</span>'; });
    h+='</div>';
  }
  h+='</div><div class="sol-sec"><div class="sol-sec-t">可测项目</div>';
  if(s.testLines){
    s.testLines.forEach(function(t){ h+='<div class="test-txt" style="margin-bottom:4px">'+esc(t)+'</div>'; });
  } else if(s.tests && Array.isArray(s.tests)){
    h+='<div class="test-list">';
    s.tests.forEach(function(t){ h+='<span class="test">'+esc(t)+'</span>'; });
    h+='</div>';
  } else if(s.tests){
    h+='<div class="test-list">';
    splitTop(s.tests).forEach(function(t){ h+='<span class="test'+(t.length>16?' wide':'')+'">'+esc(t)+'</span>'; });
    h+='</div>';
  }
  h+='</div>';
  if(s.note) h+='<div class="sol-note">'+esc(s.note)+'</div>';
  return h+'</article>';
}
function libHTML(lib){
  var n=0,h='';
  lib.groups.forEach(function(g){
    h+='<section class="subgroup"><div class="subgroup-head"><h3>'+esc(g.name)+'</h3><span>'+esc(g.sub)+'</span><span class="sg-count">'+g.sols.length+' 个方案</span></div><div class="sol-grid">';
    g.sols.forEach(function(s){ n++; h+=solHTML(s,n); });
    h+='</div></section>';
  });
  if(lib.summary) h+='<div class="summary-note">'+lib.summary+'</div>';
  return h;
}
function renderDetail(cat){
  var body=document.getElementById('detailBody');
  if(cat.id==='speaker'){
    body.innerHTML=libHTML(SPEAKER);
    document.getElementById('detailRef').innerHTML=SPEAKER.ref;
    return;
  }
  var lib=LIBS[cat.id];
  if(lib && lib.specGroups){
    var h='<div class="detail-card"><div class="note">'+esc(lib.roomNote)+'</div>';
    lib.specGroups.forEach(function(g){
      h+='<div class="spec-sec"><div class="spec-t">'+esc(g.t)+'</div><div class="test-list">';
      g.items.forEach(function(it){ h+='<span class="test">'+esc(it)+'</span>'; });
      h+='</div></div>';
    });
    h+='</div>';
    body.innerHTML=h;
    document.getElementById('detailRef').innerHTML=lib.ref;
    return;
  }
  body.innerHTML=libHTML(lib);
  document.getElementById('detailRef').innerHTML=lib.ref;
}
var catGrid=document.getElementById('catGrid');
CATS.sort(function(a,b){return parseInt(a.num,10)-parseInt(b.num,10);});
CATS.forEach(function(c){
  var b=document.createElement('button'); b.type='button';
  b.className='cat-card '+c.g+(c.hero?' hero':''); b.setAttribute('data-cat-id',c.id);
  b.setAttribute('data-group',GROUPS[c.g]); b.setAttribute('data-search',(c.name+' '+c.search).toLowerCase());
  b.innerHTML='<span class="cat-top"><span class="num">'+c.num+'</span><h2>'+esc(c.name)+'</h2><span class="cat-group">'+GROUPS[c.g]+'</span></span>'
    +'<p class="cat-hw">'+c.hw+'</p>'
    +'<span class="cat-foot"><span class="cat-go">进入方案库 →</span></span>';
  b.addEventListener('click',function(){ showDetail(c.id); });
  catGrid.appendChild(b);
});
var viewHome=document.getElementById('viewHome'), viewDetail=document.getElementById('viewDetail');
function showDetail(id){
  var cat=null; CATS.forEach(function(c){ if(c.id===id) cat=c; });
  if(!cat) return;
  document.getElementById('detailTitle').textContent=cat.num+' · '+cat.name;
  document.getElementById('crumbPath').innerHTML='<b>'+esc(cat.name)+'</b> · '+GROUPS[cat.g];
  renderDetail(cat);
  viewHome.hidden=true; viewDetail.hidden=false;
  window.scrollTo({top:0,behavior:'smooth'});
}
function showHome(){ viewDetail.hidden=true; viewHome.hidden=false; window.scrollTo({top:0,behavior:'smooth'}); }
document.getElementById('backBtn').addEventListener('click',showHome);
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !viewDetail.hidden) showHome(); });
document.querySelectorAll('[data-jump]').forEach(function(btn){ btn.addEventListener('click',function(){ showDetail(btn.getAttribute('data-jump')); }); });

/* 一级搜索 + 分组筛选 */
var q=document.getElementById('q'), empty=document.getElementById('empty');
var chips=Array.prototype.slice.call(document.querySelectorAll('.fchip')); var currentFilter='';
function apply(){
  var term=(q.value||'').trim().toLowerCase(); var visible=0;
  Array.prototype.forEach.call(catGrid.children,function(card){
    var show=(!term || card.getAttribute('data-search').indexOf(term)!==-1) && (!currentFilter || card.getAttribute('data-group')===currentFilter);
    card.style.display=show?'':'none'; if(show) visible++;
  });
  empty.classList.toggle('show',visible===0);
}
q.addEventListener('input',apply);
chips.forEach(function(ch){ ch.addEventListener('click',function(){ chips.forEach(function(c){c.classList.remove('active')}); ch.classList.add('active'); currentFilter=ch.getAttribute('data-filter')||''; apply(); }); });
</script>
</body>
